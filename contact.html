<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>

    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
</head>

<body class="contact-page">

    <!-- NAVBAR -->
    <header class="navbar">
        <nav>
            <ul>
                <li><a href="index.html">Accueil</a></li>
                <li><a href="ecole.html">CFA / École</a></li>
                <li><a href="entreprise.html">Entreprise</a></li>
                <li><a href="documentations.html">Documentations techniques</a></li>
                <li><a href="veille.html">Veille technologique</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <!-- HERO -->

    <section class="hero-entreprise">

        <img src="images/space.gif" alt="Fond spatial">

        <div class="overlay"></div>

        <div class="hero-content">

            <span class="hero-subtitle">CONTACT</span>

            <div class="hero-line"></div>

            <h1>
                CONTACTEZ-<br>MOI
            </h1>

            <p class="hero-description">
                Vous souhaitez me contacter pour une question ou simplement échanger ? Remplissez le formulaire
                ci-dessous.
            </p>

        </div>

    </section>

    <!-- CONTACT -->

    <section class="contact-section">

        <div class="contact-container">

            <!-- FORMULAIRE -->

            <div class="contact-form">

                <h2>Formulaire de contact</h2>

                <form>

                    <div class="input-group">

                        <input type="text" placeholder="Nom" required>

                        <input type="text" placeholder="Prénom" required>

                    </div>

                    <input type="email" placeholder="Adresse e-mail" required>

                    <input type="tel" placeholder="Téléphone">

                    <textarea rows="7" placeholder="Votre message..." required></textarea>

                    <button type="button" class="btn-doc">
                        Envoyer
                    </button>

                </form>

            </div>

            <!-- IMAGE -->

            <div class="contact-image">

                <img src="images/mecontacter.jpg" alt="Contact">

            </div>

        </div>

    </section>

    <!-- FOOTER -->

    <footer class="footer">
        <p>Portfolio BTS SIO - Miguel</p>
    </footer>

</body>

</html>
